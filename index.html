<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACKLABEL</title>
<style>
/* ============================================================
   색상은 여기서 바꾸세요. --brand 가 브랜드 색입니다.
   ============================================================ */
:root {
  --brand: #2E5E4E;
  --brand-fg: #FFFFFF;
  --bg: #F4F4F2;
  --surface: #FFFFFF;
  --muted: #E6E7E5;
  --fg: #2B2D2F;
  --fg-muted: #75787B;
  --line: #D9DBD8;
  --ph-stroke: #B9BCB8;
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: Arial, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --max: 1152px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161817; --surface: #1E2120; --muted: #2A2E2C; --fg: #ECEDEB;
    --fg-muted: #9A9E9B; --line: #343836; --ph-stroke: #4A4F4C; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.wrap { max-width: var(--max); margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.ph { position: relative; background: var(--muted); overflow: hidden; max-width: 100%; }
.ph:not(.has-img)::before, .ph:not(.has-img)::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top right, transparent calc(50% - .5px), var(--ph-stroke) 50%, transparent calc(50% + .5px)); }
.ph:not(.has-img)::after { transform: scaleX(-1); }
.ph > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.ph-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 1;
  font-size: 11px; letter-spacing: .12em; color: var(--fg-muted); background: var(--muted); padding: 2px 8px; white-space: nowrap; }
.ph.has-img .ph-label { display: none; }

.topbar { background: var(--brand); color: var(--brand-fg); text-align: center; font-size: 12px; letter-spacing: .15em;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; }

.header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 95%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 16px; position: relative; }
.logo { font-family: var(--font-display); font-size: 20px; letter-spacing: .03em; white-space: nowrap; }
.logo small { font-size: 12px; color: var(--fg-muted); margin-left: 8px; }
.gnb { display: flex; gap: 32px; }
.gnb a { font-size: 14px; letter-spacing: .15em; color: var(--fg-muted); }
.gnb a:first-child { color: var(--fg); text-decoration: underline; text-underline-offset: 8px; }
.gnb a:hover { color: var(--fg); }
.util { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: .15em; }
.icon { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 50%; display: inline-block; }
.menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--fg); padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer; }

.hero { margin-top: 24px; position: relative; }
.hero .ph { aspect-ratio: 21 / 9; }
.hero-shade { position: absolute; inset: 0; z-index: 2; background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.08)); }
.hero-copy { position: absolute; inset: auto 0 0 0; z-index: 3; padding: 48px; color: #fff; }
.eyebrow { font-size: 12px; letter-spacing: .2em; }
.hero-copy .eyebrow { opacity: .8; margin: 0; }
.hero-copy h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 4.5vw, 48px); line-height: 1.1; margin: 8px 0 0; text-wrap: balance; max-width: 18ch; }
.btn-hero { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; background: #fff; color: #111; font-size: 14px; padding: 8px 16px; }
.btn-hero:hover { background: var(--brand); color: var(--brand-fg); }
.hero-count { position: absolute; z-index: 3; right: 32px; bottom: 32px; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.hero-count i { width: 32px; height: 1px; background: rgba(255,255,255,.6); }

.notice { margin-block: 40px; display: flex; align-items: center; gap: 16px; border-block: 1px solid var(--line); padding-block: 12px; font-size: 14px; }
.notice-label { font-size: 11px; letter-spacing: .15em; color: var(--brand); white-space: nowrap; }
.notice a { flex: 1; min-width: 0; display: flex; justify-content: space-between; gap: 8px; }
.notice a span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notice-count { font-size: 12px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

.section { margin-block: 64px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
.sec-head .eyebrow { color: var(--fg-muted); margin: 0; }
.sec-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; margin: 8px 0 0; }
.more { font-size: 14px; text-decoration: underline; text-underline-offset: 4px; white-space: nowrap; }
.more:hover { color: var(--brand); }

.cats { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px 16px; justify-items: center; }
.cat { display: flex; flex-direction: column; align-items: center; width: 100%; padding-block: 12px; min-width: 0; }
.cat-icon { width: 32px; height: 32px; border: 1.5px dashed var(--ph-stroke); }
.cat:hover .cat-icon { border-color: var(--brand); border-style: solid; }
.cat span { margin-top: 8px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; max-width: 88%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 16px; }
.card { display: block; min-width: 0; }
.card .ph { aspect-ratio: 4 / 5; }
.card:hover .ph > img { transform: scale(1.05); }
.badge { position: absolute; z-index: 2; left: 12px; top: 12px; background: var(--brand); color: var(--brand-fg); font-size: 10px; letter-spacing: .15em; padding: 2px 8px; }
.quick { position: absolute; z-index: 2; right: 12px; bottom: 12px; width: 28px; height: 28px; background: var(--surface); display: grid; place-items: center; opacity: 0; transition: opacity .2s; }
.quick::before { content: "+"; font-size: 16px; line-height: 1; color: var(--fg); }
.card:hover .quick, .card:focus-visible .quick { opacity: 1; }
.meta { margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: .1em; color: var(--fg-muted); }
.meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot { display: inline-block; border: 1px dashed var(--ph-stroke); color: var(--fg-muted); padding: 0 6px; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 16px; margin: 4px 0 0; }
.card .price { margin: 4px 0 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.swatches { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.swatches i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ph-stroke); background: var(--muted); }
.swatches small { margin-left: 4px; font-size: 12px; color: var(--fg-muted); }

.footer { margin-top: 96px; border-top: 1px solid var(--line); background: var(--surface); }
.footer-top { display: grid; grid-template-columns: 1fr auto; gap: 32px; padding-block: 48px; }
.footer-brand { font-family: var(--font-display); font-size: 18px; margin: 0; }
.footer-desc { margin: 12px 0 0; font-size: 14px; color: var(--fg-muted); max-width: 60ch; }
.footer-nav { display: flex; gap: 24px; font-size: 14px; letter-spacing: .15em; color: var(--fg-muted); flex-wrap: wrap; }
.footer-nav a:hover { color: var(--brand); }
.copy { border-top: 1px solid var(--line); padding-block: 16px; margin: 0; font-size: 12px; color: var(--fg-muted); }

@media (max-width: 1023px) {
  .gnb { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; gap: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .gnb.open { display: flex; }
  .gnb a { padding-block: 8px; }
  .menu-btn { display: inline-block; }
}
@media (max-width: 767px) {
  .hero { margin-top: 0; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
  .hero .ph { aspect-ratio: 4 / 5; }
  .hero-copy { padding: 24px; }
  .hero-count { right: 16px; bottom: 16px; }
  .cats { grid-template-columns: repeat(4, 1fr); gap: 12px 8px; }
  .cat span { font-size: 9px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .footer-top { grid-template-columns: 1fr; }
  .util .label { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar" id="topbar"></div>

<header class="header">
  <div class="wrap">
    <a class="logo" href="./"><span id="logoName"></span><small id="logoSub"></small></a>
    <nav class="gnb" id="gnb" aria-label="주 메뉴"></nav>
    <div class="util">
      <a href="#" aria-label="검색"><span class="icon"></span></a>
      <a href="#"><span class="label" id="cartLabel"></span></a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="gnb">MENU</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-label="메인 배너">
    <div class="ph" id="heroPh"><span class="ph-label">메인 배너 이미지 · 21:9</span></div>
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h2 id="heroTitle"></h2>
      <a class="btn-hero" href="#" id="heroCta"></a>
    </div>
    <div class="hero-count"><span>01</span><i></i><span>01</span></div>
  </section>

  <div class="notice">
    <span class="notice-label">NOTICE</span>
    <a href="#"><span id="noticeText"></span><span aria-hidden="true">→</span></a>
    <span class="notice-count">1 / 1</span>
  </div>

  <section class="section" aria-labelledby="cat-h">
    <div class="sec-head">
      <div><p class="eyebrow" id="catEyebrow"></p><h2 id="cat-h"></h2></div>
    </div>
    <nav class="cats" id="cats" aria-label="카테고리"></nav>
  </section>

  <div id="sections"></div>
</main>

<footer class="footer">
  <div class="wrap footer-top">
    <div>
      <p class="footer-brand" id="footBrand"></p>
      <p class="footer-desc" id="footDesc"></p>
    </div>
    <nav class="footer-nav" id="footNav" aria-label="푸터 메뉴"></nav>
  </div>
  <div class="wrap"><p class="copy" id="copy"></p></div>
</footer>

<script>
/* ============================================================
   ★ 사이트 내용은 전부 여기서 고치면 됩니다 ★
   - 따옴표 "..." 안의 글자만 바꾸세요.
   - 사진: images 폴더에 넣고 "images/파일이름.jpg" 처럼 적기
     (파일 이름은 영문·숫자로, 장당 300KB 이하 권장)
   - 비워두면("") 빈 칸/회색 사진 자리로 보여요.
   ============================================================ */
const CONTENT = {
  brand: "BLACKLABEL",
  brandSub: "studio",
  brandColor: "#2E5E4E",
  topbar: "LOREM IPSUM DOLOR SIT AMET · CONSECTETUR ADIPISCING",
  nav: ["Lorem", "Ipsum dolor", "Sit amet", "Elit", "Sed", "Tempor", "Magna"],
  cartLabel: "Lorem (0)",

  hero: {
    image: "",                       // 예: "images/hero.jpg"  (21:9 권장)
    eyebrow: "LOREM IPSUM",
    title: "Lorem ipsum dolor sit amet consectetur",
    cta: "Lorem ipsum →"
  },

  notice: "Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod",

  catEyebrow: "LOREM IPSUM DOLOR",
  catTitle: "Lorem ipsum",
  categories: ["Lorem", "Ipsum", "Dolor", "Sit", "Amet", "Elit", "Sed", "Tempor"],

  sections: [
    {
      eyebrow: "LOREM IPSUM", title: "Dolor sit amet", more: "Lorem all →",
      products: [
        // 상품 1개 = { ... } 한 덩어리.  image 예: "images/a101.jpg"  (4:5 권장)
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "NEW" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" }
      ]
    },
    {
      eyebrow: "CONSECTETUR", title: "Adipiscing elit", more: "Lorem all →",
      products: [
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "NEW" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" },
        { image: "", name: "", price: "", meta: "LOREM · IPSUM", metaRight: "Dolor", badge: "" }
      ]
    }
  ],

  footDesc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
  footLinks: ["Lorem", "Ipsum", "Dolor"],
  copyright: "© 0000 BLACKLABEL. Lorem ipsum dolor sit amet."
};
/* ===================== 여기 아래는 고치지 않아도 됩니다 ===================== */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function setBrandColor(c) {
  if (!/^#[0-9a-f]{6}$/i.test(c)) return;
  const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
  document.documentElement.style.setProperty("--brand", c);
  document.documentElement.style.setProperty("--brand-fg", (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? "#111111" : "#FFFFFF");
}
function setPh(el, src) {
  if (!src) return;
  const img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = src;
  img.onerror = () => { img.remove(); el.classList.remove("has-img"); };
  el.classList.add("has-img"); el.prepend(img);
}

function render(c) {
  setBrandColor(c.brandColor);
  document.title = c.brand;
  $("topbar").textContent = c.topbar;
  $("logoName").textContent = c.brand;
  $("logoSub").textContent = c.brandSub;
  $("gnb").innerHTML = c.nav.map(n => `<a href="#">${esc(n)}</a>`).join("");
  $("cartLabel").textContent = c.cartLabel;
  setPh($("heroPh"), c.hero.image);
  $("heroEyebrow").textContent = c.hero.eyebrow;
  $("heroTitle").textContent = c.hero.title;
  $("heroCta").textContent = c.hero.cta;
  $("noticeText").textContent = c.notice;
  $("catEyebrow").textContent = c.catEyebrow;
  $("cat-h").textContent = c.catTitle;
  $("cats").innerHTML = c.categories.map(n => `<a class="cat" href="#"><span class="cat-icon"></span><span>${esc(n)}</span></a>`).join("");
  $("sections").innerHTML = c.sections.map((s, i) => `
    <section class="section" aria-labelledby="sec-${i}">
      <div class="sec-head">
        <div><p class="eyebrow">${esc(s.eyebrow)}</p><h2 id="sec-${i}">${esc(s.title)}</h2></div>
        <a class="more" href="#">${esc(s.more)}</a>
      </div>
      <div class="grid">${s.products.map(p => `
        <a class="card" href="#">
          <div class="ph" data-img="${esc(p.image)}"><span class="ph-label">상품 이미지 · 4:5</span>
            ${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ""}
            <span class="quick" aria-hidden="true"></span>
          </div>
          <div class="meta"><span>${esc(p.meta)}</span><span>${esc(p.metaRight)}</span></div>
          <h3>${p.name ? esc(p.name) : '<span class="slot">상품명</span>'}</h3>
          <p class="price">${p.price ? esc(p.price) : '<span class="slot">가격</span>'}</p>
          <div class="swatches"><i></i><i></i><i></i><small>+0 lorem</small></div>
        </a>`).join("")}
      </div>
    </section>`).join("");
  document.querySelectorAll("#sections .ph[data-img]").forEach(el => setPh(el, el.dataset.img));
  $("footBrand").textContent = c.brand;
  $("footDesc").textContent = c.footDesc;
  $("footNav").innerHTML = c.footLinks.map(n => `<a href="#">${esc(n)}</a>`).join("");
  $("copy").textContent = c.copyright;
}
render(CONTENT);

$("menuBtn").addEventListener("click", () => { const o = $("gnb").classList.toggle("open"); $("menuBtn").setAttribute("aria-expanded", o); });
</script>
</body>
</html>
